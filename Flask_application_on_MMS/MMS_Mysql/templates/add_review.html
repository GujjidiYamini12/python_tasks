<!DOCTYPE html>

<html>

<head>

    <title>Add Review</title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/add_review.css'
        ) }}"
    >

</head>

<body>

<div class="form-card">

<h1>⭐ Add Review</h1>

<form method="POST">

<div class="input-box">

<label>User ID</label>

<input
type="number"
name="user_id"
required
>

</div>

<div class="input-box">

<label>Movie ID</label>

<input
type="number"
name="movie_id"
required
>

</div>

<div class="input-box">

<label>Rating</label>

<select
name="rating"
required
>

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>

</select>

</div>

<div class="input-box">

<label>Review</label>

<textarea
name="review"
rows="4"
required
></textarea>

</div>

<div class="buttons">

<button
class="save-btn"
type="submit"
>
Save
</button>

<button
class="back-btn"
type="button"

onclick="
window.location.href=
'/reviews'
"
>
Back
</button>

</div>

</form>

</div>

</body>

</html>
