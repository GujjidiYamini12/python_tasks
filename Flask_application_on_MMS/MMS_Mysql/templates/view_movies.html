<!DOCTYPE html>
<html>

<head>

    <title>Movies</title>

    <link rel="stylesheet"
          href="{{ url_for(
          'static',
          filename='css/movies.css'
          ) }}">

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body>

<div class="sidebar">

    <h2>🎬 It'sShowTime</h2>

    <a href="/">Dashboard</a>
    <a href="/movies">Movies</a>
    <a href="/users">Users</a>
    <a href="/theaters">Theaters</a>
    <a href="/shows">Shows</a>
    <a href="/screens">Screens</a>
    <a href="/seats">Seats</a>

</div>

<div class="main">

    <div class="top">

        <h1>🎬 Movies</h1>

        <button
        onclick="
        window.location.href=
        '/add_movie'
        ">

            + Add Movie

        </button>

    </div>

<div id="movieCarousel"
class="carousel slide"
data-bs-ride="carousel">

<div class="carousel-inner">

<div class="carousel-item active">

<div class="movie-row">

{% for movie in movies %}

<div class="movie-card">

{% if movie[1]=="Happy Days" %}

<img src="https://upload.wikimedia.org/wikipedia/en/5/59/Happy_Days_2007_film_poster.jpg">

{% elif movie[1]=="Murari" %}

<img src="https://upload.wikimedia.org/wikipedia/en/5/54/Murari.jpg">

{% else %}

<img src="https://via.placeholder.com/300x450">

{% endif %}

<div class="content">

<h3>{{ movie[1] }}</h3>

<p>{{ movie[2] }}</p>

<p>⭐ {{ movie[3] }}</p>

<p>{{ movie[4] }}</p>

</div>

</div>

{% endfor %}

</div>

</div>

</div>

<button
class="carousel-control-prev"
type="button"

data-bs-target="#movieCarousel"

data-bs-slide="prev">

<span class="carousel-control-prev-icon">

</span>

</button>

<button
class="carousel-control-next"
type="button"

data-bs-target="#movieCarousel"

data-bs-slide="next">

<span class="carousel-control-next-icon">

</span>

</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">

</script>

</body>

</html>
