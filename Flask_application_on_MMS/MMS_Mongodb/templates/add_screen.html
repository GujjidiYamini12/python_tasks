<!DOCTYPE html>

<html>

<head>

    <title>Add Screen</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/add_screen.css') }}"
    >

</head>

<body>

    <div class="form-card">

        <h1>Add Screen</h1>

        <form method="POST">

            <div class="input-group">

                <label>Theater ID</label>

                <input
                    type="number"
                    name="theater_id"
                    required
                >

            </div>

            <div class="input-group">

                <label>Screen Name</label>

                <input
                    type="text"
                    name="screen_name"
                    required
                >

            </div>

            <button
                class="save-btn"
                type="submit"
            >
                Save
            </button>

        </form>

    </div>

</body>

</html>
