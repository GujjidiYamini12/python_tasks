@import url("add_seat.css");
<!DOCTYPE html>

<html>

<head>

    <title>Add Booking</title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/add_booking.css'
        ) }}"
    >

</head>

<body>

    <div class="form-card">

        <h1>🎟 Add Booking</h1>

        <form method="POST">

            <div class="input-box">

                <label>User ID</label>

                <input
                    type="number"
                    name="user_id"
                    required
                >

            </div>

            <div class="input-box">

                <label>Show ID</label>

                <input
                    type="number"
                    name="show_id"
                    required
                >

            </div>

            <div class="input-box">

                <label>Seat ID</label>

                <input
                    type="number"
                    name="seat_id"
                    required
                >

            </div>

            <div class="input-box">

                <label>Status</label>

                <select
                    name="status"
                    required
                >

                    <option value="">
                        Select Status
                    </option>

                    <option value="Booked">
                        Booked
                    </option>

                    <option value="Cancelled">
                        Cancelled
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                </select>

            </div>

            <div class="input-box">

                <label>Booking Date</label>

                <input
                    type="date"
                    name="booking_date"
                    required
                >

            </div>

            <div class="buttons">

                <button
                    class="save-btn"
                    type="submit"
                >
                    Save Booking
                </button>

                <button
                    class="back-btn"
                    type="button"

                    onclick="
                    window.location.href=
                    '/bookings'
                    "
                >
                    Back
                </button>

            </div>

        </form>

    </div>

</body>

</html>
