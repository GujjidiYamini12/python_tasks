<!DOCTYPE html>

<html>

<head>

    <title>Users</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/users.css') }}"
    >

</head>

<body>

    <div class="sidebar">

        <h2>🎬 MMS</h2>

        <a href="/">Dashboard</a>
        <a href="/movies">Movies</a>
        <a href="/users">Users</a>
        <a href="/theaters">Theaters</a>
        <a href="/shows">Shows</a>

    </div>

    <div class="main">

        <div class="header">

            <h1>Users</h1>

            <button
                class="add-btn"
                onclick="window.location.href='/add_user'"
            >
                + Add User
            </button>

        </div>

        <table class="user-table">

            <tr>

                <th>ID</th>
                <th>User Name</th>
                <th>Email</th>
                <th>Actions</th>

            </tr>

            {% for user in users %}

            <tr>

                <td>{{ user[0] }}</td>
                <td>{{ user[1] }}</td>
                <td>{{ user[2] }}</td>

                <td>

                    <a
                        class="edit-btn"
                        href="/edit_user/{{ user[0] }}"
                    >
                        Edit
                    </a>

                    <a
                        class="delete-btn"
                        href="/delete_user/{{ user[0] }}"
                    >
                        Delete
                    </a>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</body>

</html>
