<h2>Bookings</h2>

<table border="1">

<tr>

<th>User ID</th>

<th>Show ID</th>

<th>Status</th>

</tr>

{% for booking in bookings %}

<tr>

<td>{{booking[0]}}</td>

<td>{{booking[1]}}</td>
