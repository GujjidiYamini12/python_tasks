<!DOCTYPE html>

<html>

<head>

    <title>Movie Details</title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/view_movie.css'
        ) }}"
    >

</head>

<body>

    <div class="sidebar">

        <h2>🎬 MMS</h2>

        <a href="/">Dashboard</a>
        <a href="/movies">Movies</a>
        <a href="/users">Users</a>
        <a href="/theaters">Theaters</a>
        <a href="/shows">Shows</a>

    </div>

    <div class="main">

        <div class="header">

            <h1>🎬 Movie Details</h1>

            <button
                class="add-btn"
                onclick="window.location.href='/add_movie'"
            >
                + Add Movie
            </button>

        </div>

        <table class="movie-table">

            <tr>

                <th>ID</th>
                <th>Movie Name</th>
                <th>Genre</th>
                <th>Rating</th>
                <th>Duration</th>
                <th>Actions</th>

            </tr>

            {% for movie in movies %}

            <tr>

                <td>{{ movie[0] }}</td>

                <td>{{ movie[1] }}</td>

                <td>{{ movie[2] }}</td>

                <td>
                    ⭐ {{ movie[3] }}
                </td>

                <td>{{ movie[4] }}</td>

                <td>

                    <a
                        class="edit-btn"
                        href="/edit_movie/{{ movie[0] }}"
                    >
                        Edit
                    </a>

                    <a
                        class="delete-btn"
                        href="/delete_movie/{{ movie[0] }}"
                    >
                        Delete
                    </a>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</body>

</html>
