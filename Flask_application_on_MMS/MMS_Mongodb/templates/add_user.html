<!DOCTYPE html>

<html>

<head>

    <title>Add User</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/add_user.css') }}"
    >

</head>

<body>

    <div class="form-card">

        <h1>Add User</h1>

        <form method="POST">

            <div class="input-group">

                <label>User Name</label>

                <input
                    type="text"
                    name="username"
                    required
                >

            </div>

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    required
                >

            </div>

            <button
                class="save-btn"
                type="submit"
            >
                Save User
            </button>

            <button
                class="back-btn"
                type="button"
                onclick="window.location.href='/users'"
            >
                Back
            </button>

        </form>

    </div>

</body>

</html>
